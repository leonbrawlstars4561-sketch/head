name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Java-Version prüfen
        run: java -version

      - name: Mit Maven bauen
        run: mvn -B clean package --file vaultbalance/pom.xml

      - name: JAR als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: vaultbalance-jar
          path: vaultbalance/target/vaultbalance.jar
